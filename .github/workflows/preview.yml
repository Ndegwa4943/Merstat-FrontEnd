name: Netlify Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: netlify-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci --no-audit --prefer-offline --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ github.event.pull_request.html_url || 'https://merstat.org' }}
      - name: Deploy preview
        id: preview
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: dist
          production-deploy: false
          deploy-message: "PR preview #${{ github.event.pull_request.number }}"
          secrets: |
            NETLIFY_AUTH_TOKEN
            NETLIFY_SITE_ID
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment on PR
        if: steps.preview.outputs.deployment-url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            :eyes: Preview deploy ready.
            URL: ${{ steps.preview.outputs.deployment-url }}
            (expires when this PR is closed or the next push to the branch)
