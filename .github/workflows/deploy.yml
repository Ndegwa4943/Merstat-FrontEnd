name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA). Defaults to main."
        required: false
        default: "main"

# Never cancel an in-progress production deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }

      - name: Install
        run: npm ci --no-audit --prefer-offline --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://merstat.org

      - name: Deploy to Netlify
        id: deploy
        uses: nwtgck/actions-netlify@v4.0
        with:
          publish-dir: dist
          production-deploy: true
          deploy-message: "Deploy from ${{ github.sha }}"
          secrets: |
            NETLIFY_AUTH_TOKEN
            NETLIFY_SITE_ID
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment on commit
        if: github.event_name == 'push' && steps.deploy.outputs.deployment-url != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            :rocket: Deployed to production.
            URL: ${{ steps.deploy.outputs.deployment-url }}
            Commit: ${{ github.sha }}
